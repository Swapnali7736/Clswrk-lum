<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details</title>

    <style>
        body {
    background-color: pink;
}

label {
    font-weight: bold;
}

    </style>
</head>

<body>

    <h2>Enter your personal details below:</h2>

    <form>

        <label>Name:</label>
        <input type="text">
        <br><br>
        

        <label>Address:</label>
        <textarea rows="1" cols="35"></textarea>
        <br><br>
        

        <label>City:</label>
        <input type="text">

        <label>State:</label>
        <input type="text">
        <br><br>
        

        <label>Country:</label>
        <select>
            <option>India</option>
            <option>USA</option>
            <option>DUBAI</option>
            <option>CANADA</option>
        </select>

        <label>Postal Code:</label>
        <input type="text">
        <br><br>
        

        <label>E-mail Address:</label>
        <input type="email">
        <br>
        

        <label>Sex:</label>
        <input type="radio" name="sex"> Male
        <input type="radio" name="sex"> Female
        <input type="radio" name="sex"> Others
        <br>
        <br>

        <label>Specify your interest:</label>
        <br>
        <br>

        <input type="checkbox"> Sports
        <input type="checkbox"> Movies
        <input type="checkbox"> Puzzles
        <input type="checkbox"> Jogging
        <input type="checkbox"> Swimming
        <input type="checkbox"> Surfing the net
        <input type="checkbox"> Others

        <br>
        <br>

        <label>Seen any good website lately? write them down.</label>
        <br>
        <br>

        <textarea rows="10" cols="35"></textarea>

        <br>
        <br>

        <label>Please rate my website:</label>
        <br>
        

        <input type="radio" name="rating"> It's great
        <input type="radio" name="rating"> It's good
        <input type="radio" name="rating"> It's fair
        <input type="radio" name="rating"> It's poor

        <h2>THANKS FOR VISITING!!!</h2>

        <input type="submit" value="Submit">
        <input type="reset" value="Start Again">

    </form>

</body>

</html>
