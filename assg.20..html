<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .p{
            border:2px solid black;
            height:400px;
            width:400px;
            border-radius:15px;
            margin:auto;
            padding:10px;
        }
        #a{
            border:2px solid black;
            height:100px;
            width:100px;
            border-radius:15px;
            margin:auto;
            text-align: center;
        }
        #b{
            border:2px solid black;
            height:100px;
            width:100px;
            border-radius:15px;
            margin-right:auto;
            text-align: center;
        }
        #c{
             border:2px solid black;
            height:100px;
            width:100px;
            border-radius:15px;
            margin-left:auto; 
            text-align:center ;  
        }
    </style>
</head>
<body>
    <div class="p">
        <div id="a">1</div>
        <div id="b">2</div>
        <div id="c">3</div>
    </div>
</body>
</html>
