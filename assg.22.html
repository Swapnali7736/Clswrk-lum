<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .parent{
            background-color: rgb(168, 152, 152);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 50px;
            margin-top: 50px;
        }
        .card{
            height:550px;
            width:20%;
            border:2px solid black;
            background-color: white;

        
        }
        .card-header{
            text-align:center;
            background-color:gray;
            color:white;
            padding:10px;
        }

        .card-img img{
            height:200px;
            width:100%;
        }
        .card-body h3{
            text-align:center;

        }
        .card-body ul li i{
            color:red;
            margin-right:5px;
        }
        .card-body ul{
            line-height: 1.5;
        }
        .card-button{
            display: flex;
            justify-content: center;
        }
        .card-button button{
            color: white;
            background-color: red;
            padding: 10px;
            font-family: 17px;
        }
        
    </style>
</head>
<body>
    <div class="parent">
    <div class="card">
        <div class="card-header">
            <h1>OUTLANDER</h1>
        </div>
        <div class="card-img">
            <img src="outlander.webp">
        </div>
        <div class="card-body"> 
            <h3>Starting at $24,895</h3>
            <ul type="none">
               

                <li>  <i class="fa-solid fa-bookmark"></i>5/7 seats</li>
                
                <li> <i class="fa-solid fa-bookmark"></i>Q Series</li>
                <li> <i class="fa-solid fa-bookmark"></i>Petrol</li>
                <li> <i class="fa-solid fa-bookmark"></i>Automatic</li>
            </ul>

        </div>
        <div class="card-button"><button>LEARN MORE</button>
</div>

    </div>
    <div class="card">
        <div class="card-header">
            <h1>ECLIPSE CROSS</h1>
        </div>
        <div class="card-img">
            <img src="eclipse.webp">
        </div>
        <div class="card-body"> 
            <h3>Starting at $22,995</h3>
            <ul type="none">
               

                <li>  <i class="fa-solid fa-bookmark"></i>5 seats</li>
                
                <li> <i class="fa-solid fa-bookmark"></i>Q Series</li>
                <li> <i class="fa-solid fa-bookmark"></i>Petrol</li>
                <li> <i class="fa-solid fa-bookmark"></i>Automatic</li>
            </ul>

        </div>
        <div class="card-button"><button>LEARN MORE</button>
</div>

    </div>
    <div class="card">
        <div class="card-header">
            <h1>SHOGUN SPORT</h1>
        </div>
        <div class="card-img">
            <img src="shogun.webp">
        </div>
        <div class="card-body"> 
            <h3>Starting at $39,995</h3>
            <ul type="none">
               

                <li>  <i class="fa-solid fa-bookmark"></i>5/7 seats</li>
                
                <li> <i class="fa-solid fa-bookmark"></i>Q Series</li>
                <li> <i class="fa-solid fa-bookmark"></i>Diesel</li>
                <li> <i class="fa-solid fa-bookmark"></i>Automatic</li>
            </ul>

        </div>
        <div class="card-button"><button>LEARN MORE</button>
</div>

    </div>
    </div>
</body>
</html>
